<!doctype html>
<html lang="hu" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task 1 — Csapatbemutató | BitFaragó 2026</title>

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/team.css" />
</head>

<body data-page="team" data-base="../">
  <header class="header" id="header"></header>

  <main class="main container">
    <div class="section__header">
      <div>
        <span class="badge">Task 1</span>
        <h1>Csapatbemutató</h1>
        <p class="section__description" data-team-name></p>
      </div>
      <div class="clock">
        <i data-lucide="clock" class="clock__icon"></i>
        <time data-clock>--:--:--</time>
      </div>
    </div>

    <section class="section">
      <div class="grid grid--two">
        <div class="card" data-school-card>
          <div class="card__header">
            <i data-lucide="school" class="icon--lg"></i>
            <h2 class="card__title">Iskola</h2>
          </div>
          <div data-school></div>
        </div>

        <div class="card" data-teacher-card>
          <div class="card__header">
            <i data-lucide="graduation-cap" class="icon--lg"></i>
            <h2 class="card__title">Mentortanár</h2>
          </div>
          <div data-teachers></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section__header">
        <i data-lucide="users" class="icon--lg"></i>
        <h2>Csapattagok</h2>
      </div>
      <p class="section__description">
        Kattints a csapattag neve alatti gombra a bemutatkozásához.
      </p>
      <div class="grid grid--team" data-members></div>
    </section>

    <section class="section gallery">
      <div class="section__header">
        <i data-lucide="images" class="icon--lg"></i>
        <h2>További képek</h2>
      </div>
      <p class="section__description">
        A gombbal lépkedhetsz a képek között, az utolsó után elölről kezdi.
      </p>

      <div class="gallery__stage" data-gallery-stage>
        <p class="gallery__caption">Nyomd meg a gombot a képek megjelenítéséhez.</p>
      </div>

      <button type="button" class="btn btn--primary" data-gallery-next>
        <i data-lucide="chevron-right"></i> Következő kép
      </button>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="../vendor/lucide.min.js"></script>
  <script src="../js/core/app.js"></script>
  <script src="../js/core/dom.js"></script>
  <script src="../js/core/icons.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/format.js"></script>
  <script src="../js/components/theme.js"></script>
  <script src="../js/components/layout.js"></script>
  <script src="../js/components/clock.js"></script>
  <script src="../js/pages/team/data.js"></script>
  <script src="../js/pages/team/members.js"></script>
  <script src="../js/pages/team/gallery.js"></script>
  <script src="../js/pages/team/index.js"></script>
  <script src="../js/boot.js"></script>
</body>
