<!doctype html>
<html lang="hu" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tankolási napló | BitFaragó 2026</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body data-page="refuel" data-base="../">
    <header class="header" id="header"></header>

    <main class="main container main--wide">
      <div class="section__header">
        <h1>Tankolási napló</h1>
      </div>
      <div id="statCards" class="stat-cards"></div>

      <div class="dashboard--row">
        <div class="card new-refuel">
          <div class="card__header">
            <span class="card__icon card__icon--primary">
              <i data-lucide="plus-circle"></i>
            </span>
            <h2>Új tankolás</h2>
          </div>
          <form id="refuelForm" data-refuel-form class="refuel-form">
            <div class="form-field">
              <label for="refuelDate">Dátum</label>
              <div class="input-icon">
                <i data-lucide="calendar"></i>
                <input type="date" id="refuelDate" name="date" required />
              </div>
            </div>
            <div class="form-field">
              <label for="refuelAmount">Mennyiség (L)</label>
              <div class="input-icon">
                <i data-lucide="droplet"></i>
                <input
                  type="number"
                  id="refuelAmount"
                  name="amount"
                  step="0.01"
                  min="0.01"
                  placeholder="pl. 50"
                  required
                />
              </div>
            </div>
            <div class="form-field">
              <label for="refuelCost">Összeg (Ft)</label>
              <div class="input-icon">
                <i data-lucide="banknote"></i>
                <input
                  type="number"
                  id="refuelCost"
                  name="cost"
                  step="1"
                  min="1"
                  placeholder="pl. 25000"
                  required
                />
              </div>
            </div>
            <div class="form-field">
              <label for="refuelOdometer">Km-óra állás</label>
              <div class="input-icon">
                <i data-lucide="gauge"></i>
                <input
                  type="number"
                  id="refuelOdometer"
                  name="odometer"
                  step="1"
                  min="1"
                  placeholder="pl. 123456"
                  required
                />
              </div>
            </div>
            <p class="form-error" data-form-error hidden></p>
            <button type="submit" class="btn btn--primary">
              <i data-lucide="save"></i>
              Mentés
            </button>
          </form>
        </div>
        <div class="card monthly-chart">
          <div class="card__header">
            <span class="card__icon card__icon--primary">
              <i data-lucide="bar-chart-3"></i>
            </span>
            <div>
              <h2>Havi költségek</h2>
              <p class="card__subtitle">
                Összesen: <strong data-chart-total></strong>
              </p>
            </div>
            <select class="select card__action" data-chart-year aria-label="Év"></select>
          </div>

          <div id="monthlyChart" class="bar-chart"></div>
        </div>
      </div>

      <div class="refuel-grid">
        <div class="card refuel-panel">
          <div class="card__header">
            <span class="card__icon card__icon--primary">
              <i data-lucide="list"></i>
            </span>
            <div>
              <h2>Tankolások</h2>
              <p class="card__subtitle" data-filter-summary></p>
            </div>
          </div>
          <form class="refuel-filter" data-refuel-filter>
            <div class="form-field">
              <label for="filterFrom">Kezdő dátum</label>
              <div class="input-icon">
                <i data-lucide="calendar"></i>
                <input type="date" id="filterFrom" name="from" />
              </div>
            </div>
            <div class="form-field">
              <label for="filterTo">Záró dátum</label>
              <div class="input-icon">
                <i data-lucide="calendar"></i>
                <input type="date" id="filterTo" name="to" />
              </div>
            </div>
            <button type="reset" class="btn btn--quiet">
              <i data-lucide="x"></i>
              Törlés
            </button>
          </form>
          <div id="refuelTable" class="table-wrap"></div>
        </div>
        <div class="card refuel-panel">
          <div class="card__header">
            <span class="card__icon card__icon--primary">
              <i data-lucide="trophy"></i>
            </span>
            <div>
              <h2>Fogyasztási rangsor</h2>
              <p class="card__subtitle">
                Tankolások között, a legjobbtól
              </p>
            </div>
          </div>
          <div id="efficiencyTable" class="table-wrap"></div>
        </div>
      </div>
    </main>

    <script src="../vendor/lucide.min.js"></script>
    <script src="../js/core/app.js"></script>
    <script src="../js/core/dom.js"></script>
    <script src="../js/core/icons.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/format.js"></script>
    <script src="../js/components/theme.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/refuel/addRefuel.js"></script>
    <script src="../js/pages/refuel/monthlyStats.js"></script>
    <script src="../js/pages/refuel/stats.js"></script>
    <script src="../js/pages/refuel/history.js"></script>
    <script src="../js/pages/refuel/efficiency.js"></script>
    <script src="../js/pages/refuel/index.js"></script>
    <script src="../js/boot.js"></script>
  </body>
</html>
