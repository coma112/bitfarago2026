<!doctype html>
<html lang="hu" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BitFaragó 2026</title>
    <meta
      name="description"
      content="A Papírlyukasztók csapat BitFaragó 2026 feladatai."
    />

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pages/home.css" />
  </head>

  <body data-page="home" data-base="">
    <header class="header" id="header"></header>

    <main class="main">
      <section class="hero container">
        <span class="badge badge--primary hero__badge">
          <i data-lucide="school"></i> Ceglédi SZC Közgazdasági és Informatikai
          Technikum · Papírlyukasztók
        </span>
        <h1 class="hero__title">BitFaragó 2026</h1>
        <p class="hero__subtitle">A csapatunk feladatai.</p>
      </section>

      <section class="section container">
        <div class="grid grid--two tasks">
          <a class="card task-card" href="pages/team.html">
            <span class="task-card__icon"
              ><i data-lucide="users" class="icon--lg"></i
            ></span>
            <span class="task-card__number">1. feladat</span>
            <h2 class="card__title">Csapatbemutató oldal</h2>
            <span class="task-card__footer"
              >Megnyitás <i data-lucide="arrow-right"></i
            ></span>
          </a>

          <a class="card task-card" href="pages/refuel.html">
            <span class="task-card__icon"
              ><i data-lucide="fuel" class="icon--lg"></i
            ></span>
            <span class="task-card__number">2. feladat</span>
            <h2 class="card__title">Tankolási napló</h2>
            <span class="task-card__footer"
              >Megnyitás <i data-lucide="arrow-right"></i
            ></span>
          </a>
        </div>
      </section>
    </main>

    <script src="vendor/lucide.min.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/core/dom.js"></script>
    <script src="js/core/icons.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/format.js"></script>
    <script src="js/components/theme.js"></script>
    <script src="js/components/layout.js"></script>
    <script src="js/boot.js"></script>
  </body>
</html>
